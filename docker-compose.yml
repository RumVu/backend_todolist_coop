
services:
  db:
    image: postgres:15-alpine
    container_name: coop-postgres
    environment:
      POSTGRES_USER: rumvu
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nest_backend_todolist
    ports:
      - "6699:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - coop-network

  redis:
    image: redis:7-alpine
    container_name: coop-redis
    ports:
      - "6379:6379"
    networks:
      - coop-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop-api
    depends_on:
      - db
      - redis
    ports:
      - "6969:6969"
    environment:
      - DATABASE_URL=postgresql://rumvu:123456@db:5432/nest_backend_todolist?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=SiepCapBiMatCoopWeb2026
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=SieuCapRefreshSecret
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=6969
    volumes:
      - ./uploads:/usr/src/app/uploads
    networks:
      - coop-network

volumes:
  postgres-data:

networks:
  coop-network:
    driver: bridge
