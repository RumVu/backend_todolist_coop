name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rumvu
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: nest_backend_todolist
        ports:
          - 6699:5432
        options: >-
          --health-cmd "pg_isready -U rumvu -d nest_backend_todolist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 6969
      APP_NAME: Todolist API
      API_PREFIX: api
      JWT_ACCESS_SECRET: access-secret-key-123
      JWT_REFRESH_SECRET: refresh-secret-key-123
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://rumvu:123456@localhost:6699/nest_backend_todolist?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ENABLE_REDIS_TRANSPORT: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e

  docker:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t backend-todolist-coop:latest .

      - name: Check image
        run: docker images
